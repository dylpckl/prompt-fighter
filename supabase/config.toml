# JWT verification is off because there are no accounts — nobody ever holds a
# user JWT to verify. The publishable key that reaches these functions is public
# by design (it ships in the client bundle), so gating on it would be theatre.
# What actually limits abuse is the per-session rate check inside
# create-fighter, plus the fact that fight/ only ever touches a fighter whose
# session id matches the caller's.
[functions.create-fighter]
verify_jwt = false

[functions.fight]
verify_jwt = false
